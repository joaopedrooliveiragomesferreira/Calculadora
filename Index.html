<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tudo">
        <div class="calculadora"> 
            <h1 style="color: white;">Calculadora</h1>
            <p style="color: rgb(14, 13, 13);" id="resultado">
            </p>
            <table>
              <tr> 
                <td><button >C</button></td>
                <td><button ><</button></td>
                <td><button >/</button></td>
                <td><button >x</button></td>
              </tr>
              <tr> 
                <td><button onclick="insert('7')">7</button></td>
                <td><button onclick="insert('8')">8</button></td>
                <td><button onclick="insert('9')">9</button></td>
                <td><button>-</button></td>
              </tr>
              <tr> 
                <td><button onclick="insert('4')">4</button></td>
                <td><button onclick="insert('5')">5</button></td>
                <td><button onclick="insert('6')">6</button></td>
                <td><button >+</button></td>
              </tr>
              <tr> 
                <td><button onclick="insert('1')">1</button></td>
                <td><button onclick="insert('2')">2</button></td>
                <td><button onclick="insert('3')">3</button></td>
                <td id="igual" rowspan="2"><button style="height: 106px;" >=</button></td>
              </tr>
              <tr> 
                <td id="zero" colspan="2"><button style="width: 106px;" onclick="insert('0')">0</button></td>
                <td><button onclick="insert('.')">.</button></td>
              </tr>
            </table>
            
        </div>
    </div>

<script src="Script.js"></script>
</body>
</html>
